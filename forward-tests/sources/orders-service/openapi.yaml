openapi: 3.0.3
info:
  title: Orders service
  version: "6"
security:
  - bearer: []
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, customerId, paymentMethod, clientToken]
              properties:
                cartId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                paymentMethod: { type: string, description: Stripe token from the browser }
                clientToken: { type: string, description: Client idempotency token }
                giftNote: { type: string, maxLength: 200, description: Optional note printed on the packing slip }
      responses:
        "201": { $ref: "#/components/responses/OrderRef" }
        "400": { description: Malformed body }
        "401": { description: Missing or expired session }
        "402": { description: Payment declined }
        "409": { $ref: "#/components/responses/OrderRef" }
        "422": { description: Empty cart or validation failed }
    get:
      operationId: listOrders
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The customer's orders, newest first
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "401": { description: Missing or expired session }
        "403": { description: customerId is not the caller }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "401": { description: Missing or expired session }
        "404": { description: No such order for this customer }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/OrderRef" }
        "401": { description: Missing or expired session }
        "404": { description: No such order for this customer }
        "409": { description: The order is not confirmed, or the cancel window has passed }
        "502": { description: The shipping vendor did not confirm; the order is unchanged }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    OrderRef:
      description: The order's id and status
      content:
        application/json:
          schema:
            type: object
            required: [orderId, status]
            properties:
              orderId: { type: string, format: uuid }
              status: { type: string, enum: [pending_payment, confirmed, cancelled] }
  schemas:
    Order:
      type: object
      required: [orderId, customerId, totalUsd, currency, status, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        totalUsd: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending_payment, confirmed, cancelled] }
        giftNote: { type: string }
        createdAt: { type: string, format: date-time }
